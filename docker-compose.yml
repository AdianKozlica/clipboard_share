services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql://clipboard:clipboard@db:5432/clipboard
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clipboard
      POSTGRES_PASSWORD: clipboard
      POSTGRES_DB: clipboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipboard -d clipboard"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
